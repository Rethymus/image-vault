name: Validate and deploy Vault

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"
      - "worker/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy both Workers after validation (requires Cloudflare repository secrets)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Vault
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Worker types
        run: npm run worker:types && npm run worker:typecheck

      - name: Build Worker UI
        run: npm run build:worker
        env:
          VITE_PUBLIC_IMAGE_ORIGIN: ${{ vars.PUBLIC_IMAGE_ORIGIN || 'https://YOUR_BUCKET_ID.r2.dev' }}

      - name: Dry-run public phone upload Worker
        run: npm run worker:upload:dry-run

      - name: Dry-run admin Worker
        run: npm run worker:dry-run
        env:
          VITE_PUBLIC_IMAGE_ORIGIN: ${{ vars.PUBLIC_IMAGE_ORIGIN || 'https://YOUR_BUCKET_ID.r2.dev' }}

  deploy:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true }}
    runs-on: ubuntu-latest
    name: Deploy both Workers (optional)
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Worker UI
        run: npm run build:worker
        env:
          VITE_PUBLIC_IMAGE_ORIGIN: ${{ vars.PUBLIC_IMAGE_ORIGIN || 'https://YOUR_BUCKET_ID.r2.dev' }}

      - name: Check deployment credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain why deployment was skipped
        if: steps.credentials.outputs.available != 'true'
        run: echo "::notice::Deployment was not run because CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID is missing. Validation passed; add both repository secrets and run this workflow again with deploy=true."

      - name: Deploy public phone upload Worker
        if: steps.credentials.outputs.available == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --config wrangler.upload.jsonc

      - name: Deploy admin Worker
        if: steps.credentials.outputs.available == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --config wrangler.admin.jsonc
